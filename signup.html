<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic metadata and content management information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FinTrack - Create an account to track personal finances and budgets.">
    <meta name="author" content="Izwan Hakimi">
    <title>FinTrack | Sign Up</title>

    <!-- Bootstrap 5 CSS Framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
</head>

<body class="login-page auth-page d-flex flex-column min-vh-100">
    <main class="auth-main container">
        <div class="auth-shell auth-shell-signup">
            <section class="login-card auth-card auth-card-signup" aria-labelledby="signupTitle">
                <div class="auth-form-heading">
                    <span class="auth-mobile-logo"><i class="bi bi-graph-up-arrow" aria-hidden="true"></i></span>
                    <span class="auth-eyebrow">GET STARTED</span>
                    <h1 id="signupTitle">Create your account</h1>
                    <p>It only takes a moment to get started.</p>
                </div>

                <form id="signupForm">
                    <div class="mb-3">
                        <label for="signupUsername" class="form-label">Username</label>
                        <div class="auth-input-wrap">
                            <i class="bi bi-person" aria-hidden="true"></i>
                            <input type="text" class="form-control" id="signupUsername" placeholder="Create a username"
                                minlength="3" maxlength="30" autocomplete="username" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="signupPassword" class="form-label">Password</label>
                        <div class="password-field auth-input-wrap">
                            <i class="bi bi-lock" aria-hidden="true"></i>
                            <input type="password" class="form-control" id="signupPassword"
                                placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
                            <button type="button" class="password-toggle" data-password-toggle="signupPassword"
                                aria-label="Show password" aria-controls="signupPassword" aria-pressed="false" title="Show password">
                                <i class="bi bi-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <div class="password-field auth-input-wrap">
                            <i class="bi bi-lock-fill" aria-hidden="true"></i>
                            <input type="password" class="form-control" id="confirmPassword"
                                placeholder="Enter your password again" minlength="8" autocomplete="new-password" required>
                            <button type="button" class="password-toggle" data-password-toggle="confirmPassword"
                                aria-label="Show password" aria-controls="confirmPassword" aria-pressed="false" title="Show password">
                                <i class="bi bi-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="passwordHint" class="form-label">Password Hint</label>
                        <div class="auth-input-wrap">
                            <i class="bi bi-lightbulb" aria-hidden="true"></i>
                            <input type="text" class="form-control" id="passwordHint"
                                placeholder="A clue only you understand" maxlength="100" autocomplete="off" required>
                        </div>
                        <small class="auth-hint-help">Do not include your actual password.</small>
                    </div>
                    <div id="signupMessage" class="mb-3" role="status" aria-live="polite"></div>
                    <button type="submit" class="btn btn-primary w-100 auth-submit">
                        Create Account <i class="bi bi-arrow-right" aria-hidden="true"></i>
                    </button>
                </form>

                <div class="auth-switch">
                    <span>Already have an account?</span> <a href="index.html">Sign in</a>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="ft-footer">
        <div class="container">
            <p class="mb-1 fw-bold">FinTrack &copy; 2026. All Rights Reserved.</p>
            <small>Developed for IMS566 Individual Project &mdash; Advanced Web Design Development &amp; Content Management</small>
        </div>
    </footer>

    <!-- JavaScript file for data storage and registration logic -->
    <script src="js/storage.js"></script>
    <script src="js/signup.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/password-toggle.js"></script>

</body>
</html>
